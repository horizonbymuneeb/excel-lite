version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # SheetJS and ExcelJS are cross-check oracles: pinning their majors keeps
      # the compatibility tests meaningful.
      - dependency-name: xlsx
        update-types: [version-update:semver-major]
      - dependency-name: exceljs
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
