name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'SUPPORT.md'
      - 'CODE_OF_CONDUCT.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the documentation site
        run: npm run docs:build
      - name: sanity-check the output
        run: |
          test -f site/dist/index.html
          test -f site/dist/search-index.json
          count=$(ls site/dist/*.html | wc -l)
          echo "pages: $count"
          test "$count" -ge 20
          if grep -rq "__ID__" site/dist/*.html; then echo "unrendered anchor placeholder in docs"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
